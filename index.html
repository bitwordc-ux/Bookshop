<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Interactive Camera Control</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #121212; color: #fff; }
    .viewport { width: 640px; height: 480px; overflow: hidden; position: relative; border: 2px solid #444; background: #000; }
    video { position: absolute; top: 0; left: 0; transform-origin: center center; }
    .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; }
    button { padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

  <h2>Webcam Digital Pan, Zoom & Rotate</h2>
  
  <div class="viewport">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="controls">
    <div></div>
    <button onclick="pan(0, 30)">▲ Up</button>
    <div></div>
    <button onclick="pan(30, 0)">◄ Left</button>
    <button onclick="resetView()">Reset</button>
    <button onclick="pan(-30, 0)">Right ►</button>
    <div></div>
    <button onclick="pan(0, -30)">▼ Down</button>
    <div></div>
  </div>

  <div style="margin-top: 15px; display: flex; gap: 10px;">
    <button onclick="zoom(0.2)">Zoom In (+)</button>
    <button onclick="zoom(-0.2)">Zoom Out (-)</button>
    <button onclick="rotate(90)" style="background: #007bff;">Rotate 90°</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    let panX = 0, panY = 0, scale = 1, rotationDeg = 0;

    // Request access to webcam
    navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => alert("Webcam access error: " + err));

    function updateTransform() {
      // CSS Transform matrix handles smooth real-time rendering via hardware acceleration
      video.style.transform = `translate(${panX}px, ${panY}px) scale(${scale}) rotate(${rotationDeg}deg)`;
    }

    function pan(dx, dy) {
      panX += dx;
      panY += dy;
      updateTransform();
    }

    function zoom(dScale) {
      scale = Math.max(1, scale + dScale); // Prevent zooming out beyond 1x
      updateTransform();
    }

    function rotate(angle) {
      rotationDeg = (rotationDeg + angle) % 360;
      updateTransform();
    }

    function resetView() {
      panX = 0; panY = 0; scale = 1; rotationDeg = 0;
      updateTransform();
    }

    // Keyboard Shortcuts (Arrow keys for panning, +/- for zooming)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') pan(0, 20);
      if (e.key === 'ArrowDown') pan(0, -20);
      if (e.key === 'ArrowLeft') pan(20, 0);
      if (e.key === 'ArrowRight') pan(-20, 0);
      if (e.key === '+' || e.key === '=') zoom(0.1);
      if (e.key === '-') zoom(-0.1);
      if (e.key.toLowerCase() === 'r') rotate(90);
    });
  </script>
</body>
</html>
