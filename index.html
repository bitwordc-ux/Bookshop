<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Main Street Market - ShopBook</title>

  <!-- PWA & Favicon Configurations -->
  <link rel="icon" type="image/png" href="menu.png">
  <link rel="apple-touch-icon" href="menu.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShopBook">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM & DYNAMIC THEMING (LIGHT & DARK MODE)
       ========================================================================== */
    :root {
      /* Light Mode Palette */
      --bg-main: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-subtle: #eef0f4;
      --border-color: #dcdfe6;
      --border-dark: #b8bec9;
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --primary-active: #334155;
      
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --success: #166534;
      --success-bg: #dcfce7;
      --danger: #991b1b;
      --danger-bg: #fee2e2;
      --warning: #9a3412;
      --warning-bg: #ffedd5;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --header-height: 56px;
      --nav-height: 60px;
      --border-radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      /* Dark Mode Overrides */
      --bg-main: #090d16;
      --bg-surface: #111827;
      --bg-subtle: #1f2937;
      --border-color: #374151;
      --border-dark: #4b5563;
      
      --text-main: #f9fafb;
      --text-muted: #d1d5db;
      --text-light: #9ca3af;
      
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --primary-active: #0369a1;
      
      --accent: #60a5fa;
      --accent-light: #1e293b;
      --success: #4ade80;
      --success-bg: #064e3b;
      --danger: #f87171;
      --danger-bg: #450a0a;
      --warning: #fb923c;
      --warning-bg: #431407;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.4;
      font-size: 15px;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ==========================================================================
       LAYOUT STRUCTURE & RESPONSIVENESS
       ========================================================================== */
    #app-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    header {
      height: var(--header-height);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      color: white;
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .save-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--bg-subtle);
      white-space: nowrap;
    }

    .save-indicator.dirty {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .save-indicator.saved {
      background: var(--success-bg);
      color: var(--success);
    }

    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    #main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    sidebar {
      width: 220px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      background: transparent;
      border-top: none;
      border-right: none;
      border-bottom: none;
      width: 100%;
      text-align: left;
    }

    .nav-item svg {
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .nav-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: var(--accent-light);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    nav.bottom-nav {
      display: none;
      height: var(--nav-height);
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      grid-template-columns: repeat(4, 1fr);
      z-index: 20;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      sidebar { display: none; }
      nav.bottom-nav { display: grid; }
      main { padding: 12px 12px 24px 12px; }
      
      .brand span {
        max-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 15px;
      }

      .save-indicator span {
        display: none;
      }
      .save-indicator {
        padding: 6px;
      }
    }

    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .mobile-nav-btn.active {
      color: var(--accent);
    }

    /* ==========================================================================
       UI COMPONENTS, BUTTONS & TABLES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-dark);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      min-height: 42px;
      line-height: 1;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--bg-subtle);
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-mono);
      margin-top: 4px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      background: var(--bg-surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: var(--bg-subtle);
      padding: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    tr:last-child td { border-bottom: none; }

    .amount {
      font-family: var(--font-mono);
      font-weight: 600;
      text-align: right;
    }

    .amount-positive { color: var(--success); }
    .amount-negative { color: var(--danger); }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-info { background: var(--accent-light); color: var(--accent); }
    .badge-void { background: var(--danger-bg); color: var(--danger); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }

    /* Mobile Data List Cards */
    .mobile-data-list {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .mobile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 768px) {
      .desktop-table { display: none; }
      .mobile-data-list { display: flex; }
    }

    /* Forms & Inputs */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      background: var(--bg-surface);
      color: var(--text-main);
      appearance: none;
      -webkit-appearance: none;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      animation: fadeIn 0.2s ease-out;
    }
    .modal {
      background: var(--bg-surface);
      border-radius: var(--border-radius);
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: var(--bg-subtle);
    }

    @media (max-width: 600px) {
      .modal-overlay { padding: 0; }
      .modal {
        max-width: 100%;
        height: 100%;
        max-height: 100dvh;
        border-radius: 0;
      }
      .modal-footer {
        flex-direction: column-reverse;
      }
      .modal-footer .btn {
        width: 100%;
      }
    }

    /* Toast Notifications */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      width: calc(100% - 40px);
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--border-radius);
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      font-weight: 500;
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .toast.hide {
      animation: slideOutRight 0.25s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    .toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .toast-success { border-left: 4px solid var(--success); }
    .toast-success .toast-icon { background: var(--success-bg); color: var(--success); }

    .toast-danger { border-left: 4px solid var(--danger); }
    .toast-danger .toast-icon { background: var(--danger-bg); color: var(--danger); }

    .toast-warning { border-left: 4px solid var(--warning); }
    .toast-warning .toast-icon { background: var(--warning-bg); color: var(--warning); }

    .toast-info { border-left: 4px solid var(--accent); }
    .toast-info .toast-icon { background: var(--accent-light); color: var(--accent); }

    .toast-content {
      flex: 1;
      line-height: 1.3;
    }

    .toast-close {
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .toast-close:hover {
      color: var(--text-main);
      background: var(--bg-subtle);
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(110%); opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .cart-item-row {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      background: var(--bg-subtle);
      padding: 8px 10px;
      border-radius: var(--border-radius);
    }

    @media (max-width: 480px) {
      .cart-item-row {
        grid-template-columns: 1fr 1fr auto;
        grid-template-areas: 
          "title title title"
          "qty price delete";
      }
      .cart-item-title { grid-area: title; }
      .cart-item-qty { grid-area: qty; }
      .cart-item-price { grid-area: price; text-align: right; }
      .cart-item-delete { grid-area: delete; }

      #toast-container {
        top: 12px;
        left: 12px;
        right: 12px;
        width: auto;
      }
    }
  </style>
</head>
<body>

  <div id="app-root">
    <!-- Top Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">S</div>
        <span id="header-store-name">Main Street Market</span>
      </div>
      <div class="status-bar">
        <div id="save-status" class="save-indicator saved">
          <div class="indicator-dot"></div>
          <span id="save-status-text">Auto-Saved</span>
        </div>

        <!-- Lock App Button -->
        <button class="icon-btn" onclick="App.lockApp()" id="lock-btn" aria-label="Lock App" title="Lock App">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>

        <!-- Dark Mode Toggle Button -->
        <button class="icon-btn" onclick="App.toggleTheme()" id="theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle Theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>

        <!-- Export Backup File Button -->
        <button class="icon-btn btn-primary" onclick="App.exportBackupFile()" aria-label="Export Backup File" title="Export Backup File">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="main-container">
      <!-- Sidebar Nav -->
      <sidebar>
        <button class="nav-item active" data-tab="dashboard" onclick="App.navigate('dashboard')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span data-i18n="nav_dashboard">Dashboard</span>
        </button>
        <button class="nav-item" data-tab="transactions" onclick="App.navigate('transactions')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span data-i18n="nav_transactions">Transactions</span>
        </button>
        <button class="nav-item" data-tab="inventory" onclick="App.navigate('inventory')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span data-i18n="nav_inventory">Inventory</span>

    /* ==========================================================================
       SHOPBOOK ENGINE - CORE ARCHITECTURE & MODULES
       ========================================================================== */

    // 1. UTILITIES
    const Money = {
      toCents(val) {
        if (typeof val === 'number') return Math.round(val * 100);
        const parsed = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
        return isNaN(parsed) ? 0 : Math.round(parsed * 100);
      },
      format(cents, currency = 'USD') {
        const absolute = Math.abs(cents) / 100;
        const formatted = absolute.toLocaleString('en-US', {
          style: 'currency',
          currency: currency,
          minimumFractionDigits: 2
        });
        return cents < 0 ? `-${formatted}` : formatted;
      }
    };

    const Utils = {
      generateUUID() {
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 9);
      },
      formatDate(isoString) {
        if (!isoString) return '-';
        const d = new Date(isoString);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    };

    // 2. STATE STORE & LOCALSTORAGE PERSISTENCE
    const LOCAL_STORAGE_KEY = 'shopbook_db_state';
    const THEME_STORAGE_KEY = 'shopbook_theme';
    const LANG_STORAGE_KEY = 'shopbook_language';

    const Store = {
      state: {
        currentTab: 'dashboard',
        isDirty: false,
        isUnlocked: false,
        storeInfo: { name: 'Main Street Market', currency: 'USD', pinCode: '1234' },
        products: [],
        transactions: [],
        auditLog: [],
        cart: []
      },

      init() {
        const localData = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (localData) {
          try {
            const parsed = JSON.parse(localData);
            this.loadState(parsed);
            return;
          } catch (e) {
            console.error("Failed to parse local storage", e);
          }
        }

        try {
          const rawData = document.getElementById('embedded-db').textContent;
          const parsed = JSON.parse(rawData);
          this.loadState(parsed);
        } catch (e) {
          console.error("Failed to parse embedded storage", e);
        }
      },

      loadState(data) {
        if (data.storeInfo) this.state.storeInfo = data.storeInfo;
        if (data.products) this.state.products = data.products;
        if (data.transactions) this.state.transactions = data.transactions;
        if (data.auditLog) this.state.auditLog = data.auditLog;
      },

      getState() { return this.state; },

      autoSaveToLocalStorage() {
        const payload = {
          version: 1,
          storeInfo: this.state.storeInfo,
          products: this.state.products,
          transactions: this.state.transactions,
          auditLog: this.state.auditLog
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
        this.state.isDirty = false;
        RenderEngine.updateSaveStatus();
      },

      setDirty(dirty = true) {
        this.state.isDirty = dirty;
        RenderEngine.updateSaveStatus();
      }
    };

    // 3. AUDIT ENGINE
    const AuditEngine = {
      log(type, details) {
        const entry = {
          id: Utils.generateUUID(),
          timestamp: new Date().toISOString(),
          type: type,
          details: details
        };
        Store.state.auditLog.unshift(entry);
      }
    };

    // 4. PIPELINE ENGINE
    const Pipeline = {
      run({ name, validate, execute, description }) {
        if (validate) {
          const validationError = validate(Store.getState());
          if (validationError) {
            App.showToast(validationError, 'danger');
            return false;
          }
        }

        execute(Store.getState());
        AuditEngine.log(name, description);
        
        Store.autoSaveToLocalStorage();
        RenderEngine.render();
        return true;
      }
    };

    // 5. RENDER ENGINE & UI COMPONENTS
    const RenderEngine = {
      render() {
        const state = Store.getState();
        const viewport = document.getElementById('viewport');

        document.getElementById('header-store-name').textContent = state.storeInfo.name || 'ShopBook';
        document.title = `${state.storeInfo.name || 'ShopBook'} - Store Manager`;

        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          el.textContent = I18n.t(key);
        });

        document.querySelectorAll('[data-tab]').forEach(el => {
          if (el.getAttribute('data-tab') === state.currentTab) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });

        switch (state.currentTab) {
          case 'dashboard':
            viewport.innerHTML = Views.Dashboard(state);
            break;
          case 'transactions':
            viewport.innerHTML = Views.Transactions(state);
            break;
          case 'inventory':
            viewport.innerHTML = Views.Inventory(state);
            break;
          case 'audit':
            viewport.innerHTML = Views.Audit(state);
            break;
          case 'settings':
            viewport.innerHTML = Views.Settings(state);
            break;
          default:
            viewport.innerHTML = Views.Dashboard(state);
        }
      },

      updateSaveStatus() {
        const isDirty = Store.state.isDirty;
        const statusEl = document.getElementById('save-status');
        const textEl = document.getElementById('save-status-text');

        if (isDirty) {
          statusEl.className = 'save-indicator dirty';
          textEl.textContent = I18n.t('saving');
        } else {
          statusEl.className = 'save-indicator saved';
          textEl.textContent = I18n.t('auto_saved');
        }
      }
    };

    // 6. VIEWS MODULE
    const Views = {
      Dashboard(state) {
        const activeTxns = state.transactions.filter(t => !t.isVoid);
        const totalSales = activeTxns
          .filter(t => t.type === 'SALE')
          .reduce((acc, t) => acc + t.totalAmountCents, 0);

        const totalItems = state.products.reduce((acc, p) => acc + (p.stockQuantity || 0), 0);
        const lowStockCount = state.products.filter(p => p.stockQuantity <= (p.reorderLevel || 5)).length;

        const productSalesMap = {};
        let totalUnitsSold = 0;

        activeTxns.forEach(t => {
          if (t.type === 'SALE' && t.items) {
            t.items.forEach(item => {
              const pId = item.productId || item.name;
              if (!productSalesMap[pId]) {
                productSalesMap[pId] = {
                  name: item.name,
                  unitsSold: 0,
                  totalRevenueCents: 0
                };
              }
              productSalesMap[pId].unitsSold += item.qty;
              productSalesMap[pId].totalRevenueCents += (item.priceCents * item.qty);
              totalUnitsSold += item.qty;
            });
          }
        });

        const sortedSellingProducts = Object.values(productSalesMap)
          .sort((a, b) => b.unitsSold - a.unitsSold);

        const topProduct = sortedSellingProducts[0] ? sortedSellingProducts[0].name : 'N/A';
        const avgTransactionCents = activeTxns.length > 0 ? Math.round(totalSales / activeTxns.length) : 0;

        return `
          <h2 style="margin-bottom: 4px;">${I18n.t('dashboard_title')}</h2>
          <p style="color: var(--text-light); margin-bottom: 16px; font-size: 13px;">${I18n.t('dashboard_sub')}</p>
          
          <div class="grid grid-4" style="margin-bottom: 20px;">
            <div class="card">
              <div class="stat-label">${I18n.t('total_revenue')}</div>
              <div class="stat-value amount-positive">${Money.format(totalSales, state.storeInfo.currency)}</div>
            </div>
            <div class="card">
              <div class="stat-label">${I18n.t('transactions')}</div>
              <div class="stat-value">${activeTxns.length}</div>
            </div>
            <div class="card">
              <div class="stat-label">${I18n.t('stock_units')}</div>
              <div class="stat-value">${totalItems}</div>
            </div>
            <div class="card">
              <div class="stat-label">${I18n.t('low_stock_alerts')}</div>
              <div class="stat-value" style="${lowStockCount > 0 ? 'color: var(--danger);' : ''}">${lowStockCount}</div>
            </div>
          </div>

          <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 16px;">${I18n.t('quick_actions')}</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">

      Settings(state) {
        return `
          <h2>${I18n.t('settings_title')}</h2>
          
          <!-- STORE CONFIGURATION & LANGUAGE PANEL -->
          <div class="card" style="max-width: 500px; margin-top: 16px;">
            <h3 style="margin-bottom: 12px; font-size: 16px;">${I18n.t('store_config')}</h3>

          </div>

          <!-- GENERATE ACTIVITY REPORT PANEL -->
          <div class="card" style="max-width: 500px; margin-top: 16px;">
            <h3 style="margin-bottom: 6px; font-size: 16px;">${I18n.t('generate_report_title')}</h3>

            <div class="form-group">
              <label for="report-range">${I18n.t('time_period')}</label>
              <select id="report-range" class="form-control">
                <option value="2_days">${I18n.t('time_2_days')}</option>
                <option value="week">${I18n.t('time_week')}</option>
                <option value="month" selected>${I18n.t('time_month')}</option>
                <option value="quarter">${I18n.t('time_quarter')}</option>

            <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="App.generateReport()">

                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    <polyline points="14 2 14 8 20 8"/>

                    <polyline points="10 9 9 9 8 9"/>

                  <h3 style="font-size: 15px; margin-bottom: 2px;">${I18n.t('audit_log_card_title')}</h3>

              <button class="btn btn-sm" onclick="App.navigate('audit')" style="white-space: nowrap;">
                ${I18n.t('btn_open_audit')}
              </button>

          </div>
        `;
      }
    };

    // 7. APPLICATION CONTROLLER
    const App = {
      init() {
        this.initLanguage();
        this.initTheme();
        Store.init();

        if (Store.state.storeInfo.pinCode) {
          this.renderPinLock();
        } else {
          Store.state.isUnlocked = true;
          RenderEngine.render();
        }

        setInterval(() => {
          Store.autoSaveToLocalStorage();
        }, 60000);
      },

      initLanguage() {
        const savedLang = localStorage.getItem(LANG_STORAGE_KEY) || 'en';
        I18n.currentLang = savedLang;
      },

      setLanguage(lang) {
        I18n.currentLang = lang;
        localStorage.setItem(LANG_STORAGE_KEY, lang);
        RenderEngine.render();
        this.showToast(lang === 'sw' ? 'Lugha imebadilishwa kuwa Kiswahili' : 'Language changed to English', 'info');
      },

      showToast(message, type = 'success', duration = 3500) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;

        let iconSvg = '';
        if (type === 'success') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`;
        } else if (type === 'danger') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
        } else if (type === 'warning') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
        } else {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
        }

        toast.innerHTML = `
          <div class="toast-icon">${iconSvg}</div>
          <div class="toast-content">${message}</div>
          <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
        `;

        container.appendChild(toast);

        setTimeout(() => {
          toast.classList.add('hide');
          setTimeout(() => toast.remove(), 250);
        }, duration);
      },

      confirmDialog({ title, message, confirmText, confirmStyle = 'btn-primary', onConfirm }) {
        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = `
          <div class="modal-overlay">
            <div class="modal" style="max-width: 400px;">
              <div class="modal-header">
                <h3 style="font-size: 16px;">${title || I18n.t('confirm_title')}</h3>
                <button class="btn btn-sm" onclick="App.closeModal()">✕</button>
              </div>
              <div class="modal-body" style="padding: 20px 16px;">
                <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5;">${message}</p>
              </div>
              <div class="modal-footer" style="padding: 12px 16px;">
                <button class="btn" onclick="App.closeModal()">${I18n.t('btn_cancel')}</button>
                <button class="btn ${confirmStyle}" id="confirm-dialog-btn">${confirmText || I18n.t('btn_confirm')}</button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('confirm-dialog-btn').onclick = () => {
          App.closeModal();
          if (onConfirm) onConfirm();
        };
      },

      closeModal() {
        document.getElementById('modal-container').innerHTML = '';
      },

      renderPinLock() {
        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = `
          <div class="modal-overlay" style="background: var(--bg-main); z-index: 9999;">
            <div class="card" style="width: 100%; max-width: 340px; text-align: center; padding: 24px; box-shadow: var(--shadow-lg);">
              <div style="width: 48px; height: 48px; background: var(--accent-light); color: var(--accent); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px auto;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <h3 style="margin-bottom: 4px;">${I18n.t('modal_enter_pin')}</h3>
              <p style="color: var(--text-light); font-size: 13px; margin-bottom: 16px;">
                ${I18n.t('modal_pin_sub')}
              </p>

              <div class="form-group" style="margin-bottom: 16px;">
                <input 
                  type="password" 
                  id="pin-input" 
                  class="form-control" 
                  maxlength="8" 
                  placeholder="••••" 
                  style="text-align: center; font-size: 24px; letter-spacing: 0.3em;"
                  autofocus
                  onkeyup="if(event.key === 'Enter') App.verifyPin()"
                >
              </div>

              <button class="btn btn-primary" style="width: 100%;" onclick="App.verifyPin()">
                ${I18n.t('btn_unlock')}
              </button>
            </div>
          </div>
        `;
      },

      verifyPin() {
        const enteredPin = document.getElementById('pin-input').value.trim();
        const correctPin = Store.state.storeInfo.pinCode;

        if (enteredPin === correctPin) {
          Store.state.isUnlocked = true;
          document.getElementById('modal-container').innerHTML = '';
          RenderEngine.render();
          this.showToast(I18n.currentLang === 'sw' ? 'Imefunguliwa kikamilifu' : 'Unlocked successfully', 'success');
        } else {
          this.showToast(I18n.currentLang === 'sw' ? 'PIN sio sahihi. Jaribu tena.' : 'Incorrect PIN code. Try again.', 'danger');
          document.getElementById('pin-input').value = '';
        }
      },

      lockApp() {
        if (!Store.state.storeInfo.pinCode) {
          this.showToast(I18n.currentLang === 'sw' ? 'Hakuna PIN iliyowekwa. Weka PIN kwenye Mipangilio.' : 'No PIN code set. Configure PIN in Settings.', 'warning');
          return;
        }
        Store.state.isUnlocked = false;
        this.renderPinLock();
      },

      initTheme() {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        this.updateThemeIcon(savedTheme);
      },

      toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem(THEME_STORAGE_KEY, newTheme);
        this.updateThemeIcon(newTheme);
      },

      updateThemeIcon(theme) {
        const btn = document.getElementById('theme-toggle-btn');
        if (!btn) return;

        if (theme === 'dark') {
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
        } else {
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
        }
      },

      exportBackupFile() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(Store.getState(), null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `shopbook_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        this.showToast(I18n.currentLang === 'sw' ? 'Hati ya akiba imepakuliwa!' : 'Backup exported successfully!', 'success');
      },

      navigate(tab) {
        Store.state.currentTab = tab;
        RenderEngine.render();
      },

      updateSettings() {
        const nameVal = document.getElementById('setting-name').value.trim();
        const currVal = document.getElementById('setting-currency').value.trim().toUpperCase() || 'USD';
        const pinVal = document.getElementById('setting-pin').value.trim();

        const success = Pipeline.run({
          name: 'UPDATE_SETTINGS',
          description: `Updated store configuration (Name: "${nameVal}", Currency: "${currVal}", PIN: ${pinVal ? 'Set' : 'Disabled'})`,
          validate: () => !nameVal ? (I18n.currentLang === 'sw' ? "Jina la duka haliwezi kuwa wazi." : "Store name cannot be empty.") : null,
          execute: (state) => {
            state.storeInfo.name = nameVal;
            state.storeInfo.currency = currVal;
            state.storeInfo.pinCode = pinVal;
          }
        });

        if (success) {
          this.showToast(I18n.currentLang === 'sw' ? 'Mipangilio ya duka imehifadhiwa!' : 'Store settings saved successfully!', 'success');
        }
      },

      generateReport() {
        const range = document.getElementById('report-range').value;
        const format = document.getElementById('report-format').value;
        const state = Store.getState();

        const now = new Date();
        let cutoff = new Date();

        switch (range) {
          case '2_days': cutoff.setDate(now.getDate() - 2); break;
          case 'week': cutoff.setDate(now.getDate() - 7); break;
          case 'month': cutoff.setMonth(now.getMonth() - 1); break;
          case 'quarter': cutoff.setMonth(now.getMonth() - 3); break;
          case 'half_year': cutoff.setMonth(now.getMonth() - 6); break;
          case 'year': cutoff.setFullYear(now.getFullYear() - 1); break;
          default: cutoff.setMonth(now.getMonth() - 1);
        }

        const filteredTxns = state.transactions.filter(t => new Date(t.timestamp) >= cutoff);
        const filteredAudit = state.auditLog.filter(a => new Date(a.timestamp) >= cutoff);

        const periodSalesCents = filteredTxns
          .filter(t => t.type === 'SALE' && !t.isVoid)
          .reduce((sum, t) => sum + t.totalAmountCents, 0);

        const rangeLabels = {
          '2_days': I18n.t('time_2_days'),
          'week': I18n.t('time_week'),
          'month': I18n.t('time_month'),
          'quarter': I18n.t('time_quarter'),
          'half_year': I18n.t('time_half_year'),
          'year': I18n.t('time_year')
        };

        const htmlContent = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Activity Report - ${state.storeInfo.name}</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 30px; color: #1e293b; line-height: 1.5; }
              .header { border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 20px; }
              .header h1 { margin: 0; font-size: 22px; color: #0f172a; }
              .header p { margin: 4px 0 0 0; color: #64748b; font-size: 13px; }
              .meta-table { width: 100%; margin-bottom: 20px; border-collapse: collapse; }
              .meta-table td { padding: 6px; font-size: 13px; background: #f8fafc; border: 1px solid #e2e8f0; }
              h2 { font-size: 16px; margin-top: 24px; margin-bottom: 8px; color: #0f172a; border-left: 4px solid #2563eb; padding-left: 8px; }
              table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
              th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
              th { background-color: #f1f5f9; font-weight: bold; color: #334155; }
              .text-right { text-align: right; }
              .badge { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; display: inline-block; }
              .badge-sale { background-color: #eff6ff; color: #2563eb; }
              .badge-void { background-color: #fee2e2; color: #991b1b; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>${state.storeInfo.name || 'Store'} - Activity Report</h1>
              <p>Generated on: ${new Date().toLocaleString()} | Timeframe: ${rangeLabels[range] || range}</p>
            </div>

            <table class="meta-table">
              <tr>
                <td><strong>Period Range:</strong> ${cutoff.toLocaleDateString()} to ${now.toLocaleDateString()}</td>
                <td><strong>Total Period Revenue:</strong> ${Money.format(periodSalesCents, state.storeInfo.currency)}</td>
              </tr>
              <tr>
                <td><strong>Transactions Logged:</strong> ${filteredTxns.length}</td>
                <td><strong>Audit Actions Recorded:</strong> ${filteredAudit.length}</td>
              </tr>
            </table>

            <h2>Transactions Breakdown</h2>
            <table>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Transaction ID</th>
                  <th>Type</th>
                  <th>Items / Details</th>
                  <th>Status</th>
                  <th class="text-right">Amount</th>
                </tr>
              </thead>
              <tbody>
                ${filteredTxns.length === 0 ? '<tr><td colspan="6">No transactions in selected timeframe.</td></tr>' : ''}
                ${filteredTxns.map(t => {
                  const items = t.items ? t.items.map(i => `${i.name} (${i.qty}x)`).join(', ') : '-';
                  return `
                    <tr>
                      <td>${Utils.formatDate(t.timestamp)}</td>
                      <td style="font-family: monospace;">${t.id.substring(0, 8)}</td>
                      <td><span class="badge badge-sale">${t.type}</span></td>
                      <td>${items}</td>
                      <td>${t.isVoid ? '<span class="badge badge-void">VOIDED</span>' : 'Completed'}</td>
                      <td class="text-right">${Money.format(t.totalAmountCents, state.storeInfo.currency)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>

            <h2>Audit Log Activity</h2>
            <table>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Event Type</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>
                ${filteredAudit.length === 0 ? '<tr><td colspan="3">No system activity logged in selected timeframe.</td></tr>' : ''}
                ${filteredAudit.map(a => `
                  <tr>
                    <td>${Utils.formatDate(a.timestamp)}</td>
                    <td><strong>${a.type}</strong></td>
                    <td>${a.details}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </body>
          </html>
        `;

        const filename = `${(state.storeInfo.name || 'Store').replace(/[^a-z0-9]/gi, '_')}_Report_${range}_${now.toISOString().split('T')[0]}`;

        if (format === 'doc') {
          const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${filename}.doc`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } else {
          const printWin = window.open('', '_blank');
          printWin.document.write(htmlContent);
          printWin.document.close();
          setTimeout(() => {
            printWin.focus();
            printWin.print();
          }, 250);
        }

        AuditEngine.log('GENERATE_REPORT', `Generated ${rangeLabels[range]} activity report (${format.toUpperCase()})`);
        this.showToast(I18n.currentLang === 'sw' ? 'Ripoti imetengenezwa kikamilifu!' : 'Activity report generated successfully!', 'info');
      },

      openProductModal(productId = null) {
        const state = Store.getState();
        const product = productId ? state.products.find(p => p.id === productId) : null;

        const html = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>${product ? I18n.t('modal_edit_item') : I18n.t('modal_new_item')}</h3>
                <button class="btn btn-sm" onclick="App.closeModal()">✕</button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="prod-id" value="${product ? product.id : ''}">
                <div class="form-group">
                  <label>${I18n.t('lbl_sku')}</label>
                  <input type="text" id="prod-sku" class="form-control" value="${product ? product.sku : ''}" placeholder="e.g. ITEM-001">
                </div>
                <div class="form-group">
                  <label>${I18n.t('product_name')}</label>
                  <input type="text" id="prod-name" class="form-control" value="${product ? product.name : ''}" placeholder="e.g. Organic Apples">
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label>${I18n.t('lbl_cost_price')} (${state.storeInfo.currency})</label>
                    <input type="number" step="0.01" id="prod-cost" class="form-control" value="${product ? (product.costCents/100).toFixed(2) : '0.00'}">
                  </div>
                  <div class="form-group">
                    <label>${I18n.t('lbl_selling_price')} (${state.storeInfo.currency})</label>
                    <input type="number" step="0.01" id="prod-price" class="form-control" value="${product ? (product.priceCents/100).toFixed(2) : '0.00'}">
                  </div>
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label>${I18n.t('lbl_current_stock')}</label>
                    <input type="number" id="prod-stock" class="form-control" value="${product ? product.stockQuantity : '0'}">
                  </div>
                  <div class="form-group">
                    <label>${I18n.t('lbl_low_stock_limit')}</label>
                    <input type="number" id="prod-reorder" class="form-control" value="${product ? (product.reorderLevel || 5) : '5'}">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button class="btn" onclick="App.closeModal()">${I18n.t('btn_cancel')}</button>
                <button class="btn btn-primary" onclick="App.saveProduct()">${I18n.t('btn_save_product')}</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
      },

      saveProduct() {
        const id = document.getElementById('prod-id').value;
        const sku = document.getElementById('prod-sku').value.trim();
        const name = document.getElementById('prod-name').value.trim();
        const costCents = Money.toCents(document.getElementById('prod-cost').value);
        const priceCents = Money.toCents(document.getElementById('prod-price').value);
        const stockQuantity = parseInt(document.getElementById('prod-stock').value, 10) || 0;
        const reorderLevel = parseInt(document.getElementById('prod-reorder').value, 10) || 0;

        const success = Pipeline.run({
          name: id ? 'EDIT_PRODUCT' : 'ADD_PRODUCT',
          description: `${id ? 'Updated' : 'Added'} inventory product "${name}" (Stock: ${stockQuantity})`,
          validate: (state) => {
            if (!sku || !name) return I18n.currentLang === 'sw' ? "SKU na Jina la Bidhaa vinatakiwa." : "SKU and Product Name are required.";
            const duplicate = state.products.find(p => p.sku === sku && p.id !== id);
            if (duplicate) return I18n.currentLang === 'sw' ? `Msimbo wa SKU "${sku}" unatumiwa tayari.` : `Product SKU "${sku}" is already in use.`;
            return null;
          },
          execute: (state) => {
            if (id) {
              const p = state.products.find(item => item.id === id);
              if (p) {
                p.sku = sku;
                p.name = name;
                p.costCents = costCents;
                p.priceCents = priceCents;
                p.stockQuantity = stockQuantity;
                p.reorderLevel = reorderLevel;
              }
            } else {
              state.products.push({
                id: Utils.generateUUID(),
                sku, name, costCents, priceCents, stockQuantity, reorderLevel
              });
            }
          }
        });

        if (success) {
          this.showToast(I18n.currentLang === 'sw' ? `Bidhaa "${name}" imehifadhiwa!` : `Product "${name}" saved successfully!`, 'success');
          this.closeModal();
        }
      },

      deleteProduct(productId) {
        const state = Store.getState();
        const product = state.products.find(p => p.id === productId);
        if (!product) return;

        this.confirmDialog({
          title: I18n.currentLang === 'sw' ? 'Futa Bidhaa' : 'Delete Product',
          message: I18n.currentLang === 'sw' ? `Unahakika unataka kufuta "${product.name}" kutoka kwenye stoki?` : `Are you sure you want to delete "${product.name}" from inventory?`,
          confirmText: I18n.currentLang === 'sw' ? 'Futa Bidhaa' : 'Delete Item',
          confirmStyle: 'btn-danger',
          onConfirm: () => {
            const success = Pipeline.run({
              name: 'DELETE_PRODUCT',
              description: `Deleted product "${product.name}" (SKU: ${product.sku})`,
              execute: (st) => {
                st.products = st.products.filter(p => p.id !== productId);
              }
            });

            if (success) {
              App.showToast(I18n.currentLang === 'sw' ? `Bidhaa "${product.name}" imefutwa` : `Product "${product.name}" deleted`, 'info');
            }
          }
        });
      },

      openSaleModal() {
        const state = Store.getState();
        state.cart = [];

        if (state.products.length === 0) {
          this.showToast(I18n.currentLang === 'sw' ? "Stoki yako ni tupu. Tafadhali Ongeza bidhaa kwanza." : "Your inventory is empty. Please register inventory items first.", "warning");
          return;
        }

        this.renderSaleModal();
      },

      renderSaleModal() {
        const state = Store.getState();
        const totalCents = state.cart.reduce((acc, item) => acc + (item.priceCents * item.qty), 0);

        const html = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>${I18n.t('pos_title')}</h3>
                <button class="btn btn-sm" onclick="App.closeModal()">✕</button>
              </div>
              <div class="modal-body">
                <div class="form-group">
                  <label>${I18n.t('pos_add_item')}</label>
                  <select id="pos-product-select" class="form-control" onchange="App.addCartItem(this.value)">
                    <option value="">${I18n.t('pos_choose_item')}</option>
                    ${state.products.map(p => `
                      <option value="${p.id}" ${p.stockQuantity <= 0 ? 'disabled' : ''}>
                        ${p.name} [${p.stockQuantity} ${I18n.t('in_stock')}] - ${Money.format(p.priceCents, state.storeInfo.currency)}
                      </option>
                    `).join('')}
                  </select>
                </div>

                <h4 style="margin: 12px 0 8px 0; font-size: 14px;">${I18n.t('pos_cart_items')}</h4>
                <div id="cart-list">
                  ${state.cart.length === 0 ? `<p style="color:var(--text-light); text-align:center; padding:16px;">${I18n.t('cart_empty')}</p>` : ''}
                  ${state.cart.map((item, index) => `
                    <div class="cart-item-row">
                      <div class="cart-item-title"><strong>${item.name}</strong></div>
                      <div class="cart-item-qty">
                        <input type="number" min="1" max="${item.maxStock}" class="form-control" style="padding: 4px 8px;" value="${item.qty}" onchange="App.updateCartQty(${index}, this.value)">
                      </div>
                      <div class="cart-item-price amount">${Money.format(item.priceCents * item.qty, state.storeInfo.currency)}</div>
                      <div class="cart-item-delete">
                        <button class="btn btn-sm btn-danger" onclick="App.removeCartItem(${index})">✕</button>
                      </div>
                    </div>
                  `).join('')}
                </div>

                <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border-color);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <span style="font-weight: 700;">${I18n.t('pos_total_sale')}</span>
                  <span class="stat-value amount-positive">${Money.format(totalCents, state.storeInfo.currency)}</span>
                </div>
              </div>
              <div class="modal-footer">
                <button class="btn" onclick="App.closeModal()">${I18n.t('btn_cancel')}</button>
                <button class="btn btn-primary" ${state.cart.length === 0 ? 'disabled' : ''} onclick="App.completeSale()">${I18n.t('btn_complete_sale')}</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
      },

      addCartItem(productId) {
        if (!productId) return;
        const state = Store.getState();
        const product = state.products.find(p => p.id === productId);
        if (!product) return;

        const existing = state.cart.find(c => c.productId === productId);
        if (existing) {
          if (existing.qty < product.stockQuantity) {
            existing.qty += 1;
          } else {
            this.showToast(I18n.currentLang === 'sw' ? `Huwezi kuzidi stoki iliyopo ya ${product.stockQuantity}.` : `Cannot exceed available stock of ${product.stockQuantity}.`, 'warning');
          }
        } else {
          state.cart.push({
            productId: product.id,
            name: product.name,
            priceCents: product.priceCents,
            qty: 1,
            maxStock: product.stockQuantity
          });
        }

        this.renderSaleModal();
      },

      updateCartQty(index, qty) {
        const state = Store.getState();
        const parsed = parseInt(qty, 10);
        if (isNaN(parsed) || parsed <= 0) return;

        const item = state.cart[index];
        if (parsed > item.maxStock) {
          this.showToast(I18n.currentLang === 'sw' ? `Umetimiza kikomo cha stoki (${item.maxStock} upeo).` : `Stock limit reached (${item.maxStock} max).`, 'warning');
          item.qty = item.maxStock;
        } else {
          item.qty = parsed;
        }
        this.renderSaleModal();
      },

      removeCartItem(index) {
        const state = Store.getState();
        state.cart.splice(index, 1);
        this.renderSaleModal();
      },

      completeSale() {
        const state = Store.getState();
        if (state.cart.length === 0) return;

        const totalCents = state.cart.reduce((acc, item) => acc + (item.priceCents * item.qty), 0);
        const saleItems = [...state.cart];

        const success = Pipeline.run({
          name: 'COMPLETE_SALE',
          description: `Sale completed for ${Money.format(totalCents)} (${saleItems.map(i => `${i.qty}x ${i.name}`).join(', ')})`,
          validate: (st) => {
            for (const cartItem of saleItems) {
              const product = st.products.find(p => p.id === cartItem.productId);
              if (!product) return I18n.currentLang === 'sw' ? `Bidhaa ${cartItem.name} haipo tena.` : `Product ${cartItem.name} no longer exists.`;
              if (product.stockQuantity < cartItem.qty) {
                return I18n.currentLang === 'sw' ? `Stoki haitoshi kwa ${cartItem.name}.` : `Insufficient stock for ${cartItem.name}.`;
              }
            }
            return null;
          },
          execute: (st) => {
            saleItems.forEach(cartItem => {
              const product = st.products.find(p => p.id === cartItem.productId);
              if (product) {
                product.stockQuantity -= cartItem.qty;
              }
            });

            st.transactions.unshift({
              id: Utils.generateUUID(),
              timestamp: new Date().toISOString(),
              type: 'SALE',
              totalAmountCents: totalCents,
              items: saleItems,
              isVoid: false
            });
          }
        });

        if (success) {
          this.showToast(I18n.currentLang === 'sw' ? 'Mauzo yamekamilika kikamilifu!' : 'Sale completed successfully!', 'success');
          this.closeModal();
        }
      },

      voidTransaction(id) {
        const state = Store.getState();
        const tx = state.transactions.find(t => t.id === id);
        if (!tx || tx.isVoid) return;

        this.confirmDialog({
          title: I18n.currentLang === 'sw' ? 'Batilisha Muamala' : 'Void Transaction',
          message: I18n.currentLang === 'sw' ? `Unahakika unataka kubatilisha muamala #${id.substring(0, 8)}? Bidhaa zitarejeshwa kwenye stoki.` : `Are you sure you want to void transaction #${id.substring(0, 8)}? Items will be restored back to stock inventory.`,
          confirmText: I18n.currentLang === 'sw' ? 'Batilisha Muamala' : 'Void Transaction',
          confirmStyle: 'btn-danger',
          onConfirm: () => {
            const success = Pipeline.run({
              name: 'VOID_TRANSACTION',
              description: `Voided transaction #${id.substring(0, 8)} (${Money.format(tx.totalAmountCents)})`,
              execute: (st) => {
                const targetTx = st.transactions.find(t => t.id === id);
                if (targetTx) {
                  targetTx.isVoid = true;
                  if (targetTx.items) {
                    targetTx.items.forEach(item => {
                      const product = st.products.find(p => p.id === item.productId);
                      if (product) {
                        product.stockQuantity += item.qty;
                      }
                    });
                  }
                }
              }
            });

            if (success) {
              App.showToast(I18n.currentLang === 'sw' ? 'Muamala umebatilishwa na stoki imerejeshwa' : 'Transaction voided and inventory restored', 'info');
            }
          }
        });
      }
    };

    // Initialize application on DOM ready
    document.addEventListener('DOMContentLoaded', () => App.init());

    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered successfully:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
